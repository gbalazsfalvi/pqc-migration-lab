[versions]
junit = "6.1.3"
bouncycastle = "1.87"
jackson = "2.23.0"
archunit = "1.5.1"
spring-boot = "4.1.2"
jmh = "1.37"
commons-lang3 = "3.18.0"
guava = "33.7.2-jre"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
h2 = { module = "com.h2database:h2" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-processor = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
