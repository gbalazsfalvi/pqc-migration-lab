name: Verify PQC Migration Lab

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK 25 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to immutable commits; version comments make upgrades reviewable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Install pinned workbench dependencies
        run: npm ci --prefix workbench --no-audit --no-fund
      - name: Verify Java and workbench source, then run protocol demonstrations
        shell: bash
        run: bash ./gradlew clean check assemble probe :integration-app:demo migrationDemo rehearsalDemo --console=plain
      - name: Check the actual forked JMH harness without performance thresholds
        shell: bash
        run: bash ./gradlew benchmarkSmoke --console=plain
      - name: Retain test, coverage and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pqc-lab-${{ matrix.os }}
          path: |
            build/reports/dependency-verification/
            build/reports/technical-probe/
            build/reports/integration-demo/report.*
            build/reports/migration-demo/
            build/reports/policy-rehearsal/
            build/reports/benchmarks/
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 14
