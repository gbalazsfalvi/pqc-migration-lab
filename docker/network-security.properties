# This local reference image connects only to fixed Compose service names.
# A recreated receiver can have a new IP; neither successful nor failed lookups should hide recovery.
# Loaded as an additional security-properties file, preserving the JRE's standard provider/security configuration.
networkaddress.cache.ttl=0
networkaddress.cache.negative.ttl=0
networkaddress.cache.stale.ttl=0
